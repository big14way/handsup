<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hands Up</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #232323;
        color: #e5e5e5;
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { max-width: 420px; margin: 0 auto; padding: 28px 20px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: #a3a3a3; }
      .card { background: #2e2e2e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      .label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #a3a3a3; margin-bottom: 6px; }
      #question { font-size: 18px; color: #f4f4f4; min-height: 52px; }
      input {
        width: 100%; box-sizing: border-box; padding: 14px; border-radius: 10px; border: 1px solid #525252;
        background: #171717; color: #f4f4f4; font-size: 24px; letter-spacing: 0.3em; text-align: center;
      }
      button {
        width: 100%; padding: 14px; border-radius: 10px; border: 0; margin-top: 10px;
        background: #f4f4f4; color: #171717; font-size: 16px; font-weight: 600;
      }
      button.quiet { background: transparent; color: #e5e5e5; border: 1px solid #525252; }
      button:disabled { opacity: 0.5; }
      #error { color: #fca5a5; min-height: 22px; margin-top: 8px; }
      .row { display: flex; gap: 10px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hands Up</h1>
      <p id="status">Connecting to your glasses…</p>

      <section id="pair" class="card" hidden>
        <div class="label">Host code</div>
        <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
        <button id="pairBtn">Connect</button>
        <div id="error"></div>
      </section>

      <section id="live" hidden>
        <div class="card">
          <div class="label" id="meta">On your glasses</div>
          <div id="question"></div>
        </div>
        <div class="row">
          <button id="doneBtn">Answered</button>
          <button id="skipBtn" class="quiet">Skip</button>
        </div>
        <button id="micBtn" class="quiet">Microphone: on</button>
        <button id="endBtn" class="quiet">End session</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
