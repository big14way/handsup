<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hands Up</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
    <style>
      :root {
        --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
        --card: var(--tg-theme-bg-color, #ffffff);
        --text: var(--tg-theme-text-color, #111114);
        --hint: var(--tg-theme-hint-color, #7d7d85);
        --accent: var(--tg-theme-button-color, #2481cc);
        --on-accent: var(--tg-theme-button-text-color, #ffffff);
        --line: color-mix(in srgb, var(--hint) 22%, transparent);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
      header h1 { font-size: 20px; margin: 4px 0 2px; }
      header p { margin: 0 0 14px; color: var(--hint); font-size: 14px; }
      .ask { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 18px; }
      textarea {
        width: 100%; min-height: 68px; resize: none; border: 0; outline: 0; background: transparent;
        color: var(--text); font: inherit;
      }
      textarea::placeholder { color: var(--hint); }
      .ask-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .count { color: var(--hint); font-size: 13px; }
      button { font: inherit; border: 0; cursor: pointer; }
      .send { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 9px 18px; font-weight: 600; }
      .send:disabled { opacity: 0.45; }
      #error { color: #d14343; font-size: 14px; min-height: 20px; margin-top: 6px; }
      h2 { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--hint); margin: 18px 4px 8px; }
      .q { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
      .q.live { outline: 2px solid var(--accent); }
      .q .body { flex: 1; min-width: 0; }
      .q .text { overflow-wrap: anywhere; }
      .q .who { color: var(--hint); font-size: 13px; margin-top: 4px; }
      .q .summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 15px; }
      .badge { display: inline-block; background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
      .vote {
        min-width: 52px; border-radius: 10px; padding: 7px 4px; background: transparent; color: var(--text);
        border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; line-height: 1.15;
      }
      .vote .n { font-weight: 700; }
      .vote .arrow { font-size: 12px; color: var(--hint); }
      .vote.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      .vote.on .arrow { color: var(--on-accent); }
      .vote:disabled { cursor: default; }
      .empty { color: var(--hint); text-align: center; padding: 26px 10px; }
      .tip { margin-top: 8px; background: transparent; color: var(--accent); padding: 0; font-size: 14px; font-weight: 600; }
      .sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
      .sheet {
        position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 16px 16px 0 0;
        padding: 18px 16px 26px; max-width: 560px; margin: 0 auto;
      }
      .sheet h3 { margin: 0 0 4px; font-size: 17px; }
      .sheet p { margin: 0 0 14px; color: var(--hint); font-size: 14px; }
      .sheet .quote { color: var(--text); font-size: 15px; margin-bottom: 12px; }
      .amounts { display: flex; gap: 8px; }
      .amounts button { flex: 1; padding: 12px 0; border-radius: 10px; background: var(--bg); color: var(--text); font-weight: 600; }
      .amounts button:disabled { opacity: 0.5; }
      #tipStatus { min-height: 20px; margin-top: 12px; font-size: 14px; }
      #tonConnect { margin-top: 12px; display: flex; justify-content: center; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Q&amp;A</h1>
        <p id="sub">Loading…</p>
      </header>

      <section class="ask" id="askBox" hidden>
        <textarea id="text" maxlength="280" placeholder="Ask the host a question"></textarea>
        <div class="ask-row">
          <span class="count" id="count">0 / 280</span>
          <button class="send" id="send" disabled>Ask</button>
        </div>
        <div id="error"></div>
      </section>

      <div id="lists"></div>
    </main>

    <div id="tipSheet" hidden>
      <div class="sheet-back" id="tipBack"></div>
      <div class="sheet">
        <h3>Tip to push this question up</h3>
        <p>TON testnet. The tip goes straight to the host’s wallet; Hands Up never holds it.</p>
        <div class="quote" id="tipQuote"></div>
        <div class="amounts" id="tipAmounts"></div>
        <div id="tipStatus"></div>
        <div id="tonConnect"></div>
      </div>
    </div>

    <script>
      const tg = window.Telegram?.WebApp
      tg?.ready()
      tg?.expand()

      const params = new URLSearchParams(location.search)
      const sid = tg?.initDataUnsafe?.start_param || params.get('sid') || ''
      const headers = { 'content-type': 'application/json' }
      if (tg?.initData) headers['x-telegram-init-data'] = tg.initData
      else if (params.get('dev')) headers['x-dev-user'] = params.get('dev')

      const $ = id => document.getElementById(id)
      const el = (tag, cls, text) => {
        const node = document.createElement(tag)
        if (cls) node.className = cls
        if (text !== undefined) node.textContent = text
        return node
      }

      async function call(path, body) {
        const res = await fetch(path, body ? { method: 'POST', headers, body: JSON.stringify(body) } : { headers })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.error || 'Something went wrong.')
        return data
      }

      function card(q) {
        const live = q.status === 'live' || q.status === 'draft'
        const node = el('div', 'q' + (live ? ' live' : ''))
        const body = el('div', 'body')
        if (live) body.append(el('div', 'badge', 'On the host’s glasses now'))
        body.append(el('div', 'text', q.text))
        const boost = q.boost > 0 ? ` · boosted ${q.boost} TON` : ''
        body.append(el('div', 'who', (q.mine ? 'You' : q.tg_name) + boost))
        if (q.status === 'answered' && q.summary) body.append(el('div', 'summary', q.summary))
        if (tipsOn && q.status === 'open') {
          const tip = el('button', 'tip', 'Tip TON to push it up')
          tip.addEventListener('click', () => openTip(q))
          body.append(tip)
        }
        node.append(body)

        const vote = el('button', 'vote' + (q.voted ? ' on' : ''))
        vote.append(el('span', 'arrow', '▲'), el('span', 'n', String(q.votes)))
        vote.disabled = q.voted || q.status !== 'open'
        vote.addEventListener('click', async () => {
          vote.disabled = true
          tg?.HapticFeedback?.impactOccurred('light')
          await call('/api/app/vote', { qid: q.id }).catch(() => {})
          refresh()
        })
        node.append(vote)
        return node
      }

      // ---------- TON testnet tips ----------

      let tipsOn = false
      let tonConnect = null
      const sleep = ms => new Promise(r => setTimeout(r, ms))

      function wallet() {
        if (!tonConnect && window.TON_CONNECT_UI) {
          tonConnect = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: location.origin + '/tonconnect-manifest.json',
            buttonRootId: 'tonConnect',
          })
        }
        return tonConnect
      }

      function closeTip() {
        $('tipSheet').hidden = true
      }
      $('tipBack').addEventListener('click', closeTip)

      async function openTip(q) {
        $('tipQuote').textContent = q.text
        $('tipStatus').textContent = ''
        $('tipAmounts').replaceChildren()
        $('tipSheet').hidden = false
        let info
        try {
          info = await call('/api/app/tip/' + q.id)
        } catch (e) {
          $('tipStatus').textContent = e.message
          return
        }
        const ui = wallet()
        if (!ui) {
          $('tipStatus').textContent = 'Could not load TON Connect.'
          return
        }
        for (const option of info.options) {
          const b = el('button', '', option.ton + ' TON')
          b.addEventListener('click', () => sendTip(q, info, option, ui))
          $('tipAmounts').append(b)
        }
      }

      async function sendTip(q, info, option, ui) {
        const buttons = [...$('tipAmounts').querySelectorAll('button')]
        buttons.forEach(b => (b.disabled = true))
        const status = $('tipStatus')
        try {
          if (!ui.connected) {
            status.textContent = 'Connect a TON testnet wallet first.'
            await ui.openModal()
            buttons.forEach(b => (b.disabled = false))
            return
          }
          status.textContent = 'Confirm the tip in your wallet…'
          await ui.sendTransaction({
            validUntil: Math.floor(Date.now() / 1000) + 300,
            network: info.network,
            messages: [{ address: info.address, amount: option.nano, payload: info.payload }],
          })
          status.textContent = 'Sent. Waiting for TON testnet to confirm…'
          // Testnet usually confirms in seconds but can take a few minutes.
          for (let i = 0; i < 36; i++) {
            await sleep(i < 15 ? 3000 : 6000)
            const res = await call('/api/app/tip/' + q.id + '/check', {}).catch(() => null)
            if (res && res.credited > 0) {
              status.textContent = `Tip received. This question now has ${res.boost} TON behind it.`
              tg?.HapticFeedback?.notificationOccurred('success')
              lastJson = ''
              refresh()
              setTimeout(closeTip, 1800)
              return
            }
          }
          status.textContent = 'Still waiting for TON testnet. Your tip is checked again before the host moves to the next question, so it will still count.'
        } catch (e) {
          status.textContent = 'The tip was not sent.'
          buttons.forEach(b => (b.disabled = false))
        }
      }

      let lastJson = ''
      async function refresh() {
        let data
        try {
          data = await call('/api/app/session/' + encodeURIComponent(sid))
        } catch (e) {
          $('sub').textContent = e.message
          return
        }
        const json = JSON.stringify(data)
        if (json === lastJson) return
        lastJson = json

        const ended = data.status !== 'live'
        tipsOn = Boolean(data.wallet) && !ended
        $('title').textContent = data.title
        $('sub').textContent = ended
          ? 'This Q&A has ended.'
          : `Hosted by ${data.host || 'the host'}. The top question goes to their glasses.`
        $('askBox').hidden = ended

        const open = data.questions.filter(q => q.status !== 'answered')
        const answered = data.questions.filter(q => q.status === 'answered')
        const lists = $('lists')
        lists.replaceChildren()
        if (!ended) {
          lists.append(el('h2', '', 'Waiting'))
          if (open.length === 0) lists.append(el('div', 'empty', 'No questions yet. Ask the first one.'))
          open.forEach(q => lists.append(card(q)))
        }
        if (answered.length) {
          lists.append(el('h2', '', 'Answered'))
          answered.forEach(q => lists.append(card(q)))
        }
      }

      const text = $('text')
      const send = $('send')
      text.addEventListener('input', () => {
        $('count').textContent = `${text.value.length} / 280`
        send.disabled = text.value.trim().length < 5
        $('error').textContent = ''
      })
      send.addEventListener('click', async () => {
        send.disabled = true
        try {
          const asked = await call('/api/app/ask', { sid, text: text.value })
          text.value = ''
          if (asked.merged) $('error').textContent = 'Someone already asked that, so we added your vote to it.'
          $('count').textContent = '0 / 280'
          tg?.HapticFeedback?.notificationOccurred('success')
          await refresh()
        } catch (e) {
          $('error').textContent = e.message
          send.disabled = false
        }
      })

      if (!sid) {
        $('sub').textContent = 'Open this from the “Ask or upvote” button in your group.'
      } else {
        refresh()
        setInterval(refresh, 3000)
      }
    </script>
  </body>
</html>
